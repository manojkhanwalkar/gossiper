template: Hello, %s!
defaultName: Stranger

# TLS keystore location and password come from the environment so no secret is
# committed. Startup fails if either variable is unset:
#   GOSSIPER_KEYSTORE_PATH      absolute path to the JKS keystore
#   GOSSIPER_KEYSTORE_PASSWORD  keystore password
server:
  #  softNofileLimit: 1000
  #  hardNofileLimit: 1000
  applicationConnectors:
    - type: https
      port: 8480
      keyStorePath: ${GOSSIPER_KEYSTORE_PATH}
      keyStorePassword: ${GOSSIPER_KEYSTORE_PASSWORD}
    #this requires the alpn-boot library on the JVM's boot classpath
    #- type: h2
    #  port: 8445
    #  keyStorePath: example.keystore
    #  keyStorePassword: example
  # The admin port (metrics, thread dumps, tasks) has no authentication, so it
  # only listens on loopback.
  adminConnectors:
    - type: https
      port: 8481
      bindHost: 127.0.0.1
      keyStorePath: ${GOSSIPER_KEYSTORE_PATH}
      keyStorePassword: ${GOSSIPER_KEYSTORE_PASSWORD}
